apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: intelligtest-cloud-ingress-v2
  namespace: intelligtest-namespace
  annotations:
    kubernetes.io/ingress.class: "gce"
    networking.gke.io/managed-certificates: "intelligtest-cert"
    kubernetes.io/ingress.allow-http: "true"
spec:
  rules:
    - host: intelligtest.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway-service
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: user-interface-service
                port:
                  number: 80
