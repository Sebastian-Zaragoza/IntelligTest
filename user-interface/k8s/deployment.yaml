apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-interface-deployment
  namespace: intelligtest-namespace
spec:
  replicas: 2
  selector:
    matchLabels:
      app/component: user-interface
  template:
    metadata:
      name: user-interface-pod
      labels:
        app/name: user-interface-pod
        app/component: user-interface
    spec:
      containers:
        - name: user-interface-container
          image: zaragozasebastian/user-interface-intelligtest:3
          ports:
            - containerPort: 80
          env:
            - name: VITE_API_URL
              valueFrom:
                secretKeyRef:
                  key: VITE_API_URL
                  name: user-interface-secrets
            - name: VITE_AUTH_URL
              valueFrom:
                secretKeyRef:
                  key: VITE_AUTH_URL
                  name: user-interface-secrets


