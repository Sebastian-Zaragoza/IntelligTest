apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: user-interface-ingress
  namespace: intelligtest-namespace
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: app.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: user-interface-service
                port:
                  number: 80
