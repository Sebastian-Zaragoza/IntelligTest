server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  # Prevent browsers from caching the logo so updates apply immediately
  location = /Logo.png {
    add_header Cache-Control "no-cache, must-revalidate";
    add_header Pragma "no-cache";
  }
}
