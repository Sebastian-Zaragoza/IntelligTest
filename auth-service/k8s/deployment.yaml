apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service-deployment
  namespace: intelligtest-namespace
spec:
  replicas: 2
  selector:
    matchLabels:
      app/component: auth-service
  template:
    metadata:
      name: auth-service-pod
      labels:
        app/name: auth-service-pod
        app/component: auth-service
    spec:
      containers:
        - name: auth-service-container
          image: zaragozasebastian/auth-service-intelligtest:latest
          ports:
            - containerPort: 4001
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-service-secrets
                  key: JWT_SECRET
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: auth-service-secrets
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: auth-service-secrets
                  key: SMTP_PORT
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: auth-service-secrets
                  key: SMTP_USER
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: auth-service-secrets
                  key: SMTP_PASS
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: auth-service-secrets
                  key: DATABASE_URL
            - name: PORT
              valueFrom:
                secretKeyRef:
                  name: auth-service-secrets
                  key: PORT
            - name: FRONTEND_URL
              valueFrom:
                secretKeyRef:
                  name: auth-service-secrets
                  key: FRONTEND_URL


